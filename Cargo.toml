[package]
name = "org-semantic"
version = "0.1.0"
edition = "2021"
description = "Search a tree of org-mode notes by meaning or by words. One static binary, no database, no Python."
license = "MIT"
repository = "https://github.com/alberti42/org-semantic"
authors = ["Andrea Alberti <a.alberti82@gmail.com>"]
keywords = ["org-mode", "semantic-search", "embeddings", "notes", "emacs"]
categories = ["command-line-utilities", "text-processing"]
readme = "README.md"

[dependencies]
# `default-features = false` drops `image-models`, which pulls the whole image
# stack (image, ravif, av-scenechange) for CLIP support this does not use.
fastembed = { version = "5.17.4", default-features = false, features = [
    "ort-download-binaries-native-tls",
    "hf-hub-native-tls",
] }
# Pinned to exactly what fastembed depends on, so both resolve to one `ort` and
# the prebuilt static runtime is shared rather than built twice.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["coreml"] }
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }
# Lexical search.  Its analyzer pipeline (tokenizing, stemming, stopwords) and
# query parser are the parts worth not reimplementing; BM25 scoring alone would
# have been fifteen lines.
tantivy = "0.26"
# Language classification for `--lang auto`: fastText's `lid.176`, 176
# languages.  Pinned to the 0.7 line, which binds the C++ library.  0.8 is a
# pure-Rust rewrite that returns nonsense for quantized models like this one —
# see docs/fasttext-lid.md before "upgrading".
fasttext = "0.7.8"
# Fetches the classifier model on first use.  Already in the tree via hf-hub, so
# depending on it directly costs nothing.
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# JSON-RPC over stdio with LSP's `Content-Length` framing, which is what
# `jsonrpc.el` reads.  The framing was hand-rolled once and was never the reason
# to stop: `Connection::sender` is a cloneable channel, so an indexing worker can
# answer and report without racing the request loop for the descriptor.
# `lsp-types` is deliberately *not* taken — this speaks its own methods, and
# `initialize` is the only LSP shape it needs.
lsp-server = "0.10.0"
# The channel `lsp-server` hands out.  Already in the tree via tantivy; naming it
# here is what makes its types usable in a signature.
crossbeam-channel = "0.5.16"

# One call: `kill(pid, 0)`, to ask whether the process holding a vault's index
# lock is still there.  It was dropped when `serve`'s SIGINT handler went and is
# back for this; free either way, being in the tree via half the dependencies
# above.
[target."cfg(unix)".dependencies]
libc = "0.2.189"

[profile.release]
opt-level = 3
