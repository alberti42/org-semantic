# What `make test' and `make lint' already define, on every push to main and
# every pull request: the Rust side and the Emacs client under lisp/.
#
# Two jobs, because they need different things.  The Emacs job needs no Rust
# toolchain, so it runs across the matrix; the Rust job builds the binary
# once and is where `cargo' lives.
#
# The two Emacs tests that drive the real binary look for it at
# target/release and skip when it is not there, which is every job but the
# Rust one -- so that job installs Emacs after building and runs the Emacs
# suite again, with nothing skipped.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  elisp:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version: ['29.1', '29.4', '30.2', '31.1', 'snapshot']
    name: Emacs ${{ matrix.emacs_version }}
    # A snapshot Emacs breaks for reasons that are not this package's;
    # it is here as early warning, not as a gate.
    continue-on-error: ${{ matrix.emacs_version == 'snapshot' }}
    steps:
      - uses: actions/checkout@v5

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}

      - name: Report version
        run: emacs --version | head -1

      # Byte-compilation with warnings fatal, then checkdoc over each file.
      - run: make lint-elisp

      - run: make test-elisp

  rust:
    runs-on: ubuntu-latest
    name: Rust, and the Emacs tests that need the binary
    steps:
      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@v2

      - name: Report versions
        run: |
          cargo --version
          rustc --version

      # Formatting and lints first: they are the fast failures.
      - run: cargo fmt --check

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo build --release --locked

      # The tests that need an embedding model are `#[ignore]'d, so this runs
      # offline: the concurrency tests ask for `mode: "lexical"' on both sides.
      - run: cargo test --release --locked

      # TEMPORARY: the Emacs suite reports "Server died" here and nowhere
      # else, and the client keeps the server's stderr in a buffer the ERT
      # output does not print.  Drive the handshake by hand so the log has it.
      - name: Probe the server by hand
        continue-on-error: true
        run: |
          ./target/release/org-semantic --version || echo "version exit: $?"
          python3 - > handshake.bin <<'PY'
          import sys
          def frame(body):
              return "Content-Length: %d\r\n\r\n%s" % (len(body), body)
          sys.stdout.write(frame('{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"capabilities":{}}}'))
          sys.stdout.write(frame('{"jsonrpc":"2.0","method":"initialized"}'))
          sys.stdout.write(frame('{"jsonrpc":"2.0","id":2,"method":"shutdown"}'))
          sys.stdout.write(frame('{"jsonrpc":"2.0","method":"exit"}'))
          PY
          ./target/release/org-semantic serve < handshake.bin; echo "serve exit: $?"
          ldd ./target/release/org-semantic || true

      - name: Install Emacs
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends emacs

      # TEMPORARY, and the one thing the ERT output does not print: what the
      # server said on stderr when the Emacs client, rather than a shell, was
      # driving it.
      - name: Ask the client to start the server, and print its stderr
        continue-on-error: true
        run: |
          emacs --version | head -1
          emacs --batch --no-init-file -L lisp -L test --eval '(progn
            (require (quote org-semantic))
            (setq org-semantic-executable (expand-file-name "target/release/org-semantic"))
            (message "binary: %S" (org-semantic--binary))
            (message "version: %S" (org-semantic-binary-version))
            (let ((dir (make-temp-file "probe" t)))
              (with-temp-file (expand-file-name "a.org" dir) (insert "* One\nA note.\n"))
              (condition-case e (message "status: %S" (org-semantic-status dir))
                (error (message "signalled: %S" e))))
            (message "--- server stderr ---")
            (when (get-buffer "*org-semantic stderr*")
              (message "%s" (with-current-buffer "*org-semantic stderr*" (buffer-string)))))'

      # target/release/org-semantic exists now, so the two tests that spawn it
      # run here instead of skipping.
      - run: make test-elisp
