name: Release

# Push a version tag (v0.2.0) to build the binaries, sign and notarize the macOS
# one, and publish a *draft* GitHub release with them attached.  Review the draft
# and click Publish.  The body is the tag's section of CHANGELOG.md, so move
# [Unreleased] into a dated version heading before tagging -- a tag with no such
# section is refused rather than published empty.
#
# Required repository secrets:
#   CERTIFICATE_BASE64    base64 of the "Developer ID Application" .p12
#   CERTIFICATE_PASSWORD  password protecting that .p12
#   APPLE_ID              Apple ID used for notarization
#   APPLE_ID_PASSWORD     app-specific password for that Apple ID
#
# One asset per platform: an archive named for the platform, holding a binary
# named `org-semantic`.  Bare binaries were tried for a day and are wrong twice
# over -- 40.7 MB against 13.0 MB packed, and a release asset carries no mode
# bits, so one downloads as 0644 and does not run.
#
# **There is no Intel macOS build, and it is not an omission.**  `ort` selects a
# prebuilt ONNX Runtime from its own dist table, and that table has no
# `x86_64-apple-darwin` row at all -- the build fails with "no prebuilt binaries
# available for target".  Shipping one would mean building ONNX Runtime from
# source and linking `ort` against it.  Apple Silicon Macs and Rosetta cannot run
# it either: Rosetta translates x86_64, and there is no x86_64 binary to
# translate.

# **Runnable by hand, and that is how to test it.**  A tag-triggered workflow
# tested by tagging leaves a tag behind pointing at whatever failed, and the
# parts most likely to fail -- signing, notarization -- are also the slowest and
# the last to run.  `workflow_dispatch` builds, signs and notarizes exactly as a
# tag would, and stops before publishing anything: the `release` job is the only
# one that does not run.  Nothing is created, so a failed dry run costs minutes
# and leaves no tag, no release and no tidying up.
#
# Dispatch it against the `Unreleased` section, which is the honest thing to
# build against before a release is cut -- and tests the changelog extractor at
# the same time.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      section:
        description: 'Changelog section to build against ("Unreleased" for a dry run)'
        default: 'Unreleased'
        required: true

permissions:
  contents: write

env:
  TEAM_ID: 9V3X7C8VCK

jobs:
  # **Two versions, deliberately.**  The tag is the *release*, which is the
  # package's: it moves whenever anything ships, an elisp-only change included.
  # Cargo.toml is the *binary's*, and moves only when the Rust does -- otherwise
  # every documentation fix would hand users a 40 MB download with nothing in it.
  #
  # So the tag must equal the elisp release version, and nothing here compares
  # either of them to Cargo.toml.  What is checked instead is the one way the
  # pair can actually be broken: a package requiring a binary newer than the one
  # this release builds, which no user could satisfy.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Whole history and every tag: the check below compares this release
          # against the one before it.
          fetch-depth: 0
      - name: What is being built
        id: what
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "section=${{ inputs.section }}" >> "$GITHUB_OUTPUT"
          else
            echo "section=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
      - name: The tag is the release, and the elisp must say so
        run: |
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          ELISP=$(sed -n 's/^(defconst org-semantic-version "\(.*\)".*/\1/p' lisp/org-semantic.el)
          MIN=$(sed -n 's/^(defconst org-semantic-minimum-binary-version "\(.*\)".*/\1/p' lisp/org-semantic.el)
          echo "elisp=$ELISP  binary=$CARGO  needs>=$MIN"
          # A minimum above the binary being shipped is unsatisfiable: every user
          # of this release would be warned by the release itself.  Checked on a
          # dry run too, since it is a property of the tree rather than the tag.
          printf '%s\n%s\n' "$MIN" "$CARGO" | sort -C -V || {
            echo "::error::this package needs a binary >= $MIN but ships $CARGO"; exit 1; }
          # Only a tag claims to be a release, so only a tag has to match one.
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            test "$TAG" = "$ELISP" || {
              echo "::error::org-semantic-version is $ELISP, tag says $TAG"; exit 1; }
          fi

      # **Rust that changed must say so, or the floor stops being able to name
      # anything.**  `org-semantic-minimum-binary-version` works by naming the
      # binary version that introduced what the elisp needs.  Ship two different
      # binaries reporting the same version and no floor can tell them apart: a
      # user on the older one is told nothing and meets an "unknown method"
      # instead.  Silent, and only discovered by whoever hits it.
      #
      # Comparing against the previous *tag* rather than the previous commit, so
      # this asks the question a release asks: has the binary changed since the
      # last one that shipped?  Skipped when there is no previous tag, and on a
      # dry run, which has no release to be compared with.
      - name: Rust that changed since the last release must carry a new version
        if: github.event_name == 'push'
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -z "$PREV" ]; then echo "no previous tag; nothing to compare"; exit 0; fi
          NOW=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          WAS=$(git show "$PREV:Cargo.toml" | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          echo "since $PREV: binary was $WAS, is $NOW"
          if git diff --quiet "$PREV" HEAD -- src/ Cargo.lock; then
            echo "no Rust change since $PREV"
          elif [ "$NOW" = "$WAS" ]; then
            echo "::error::the Rust changed since $PREV but Cargo.toml still says $NOW"
            git diff --stat "$PREV" HEAD -- src/ Cargo.lock
            exit 1
          fi
      # The changelog is the only place release prose lives.  A second copy per
      # tag would drift from it, which is how the README and the manual drifted
      # the first time a tagline changed.
      - name: Take the release body out of the changelog
        env:
          SECTION: ${{ steps.what.outputs.section }}
        run: |
          # Stops at the next version heading, and at the link-reference block
          # the format keeps at the foot of the file — which follows the last
          # section and would otherwise be published as part of it.
          awk -v v="$SECTION" '
            $0 ~ "^## \\[" v "\\]"  { inside = 1; next }
            inside && /^## \[/      { exit }
            inside && /^\[.*\]: /   { exit }
            inside                  { print }
          ' CHANGELOG.md > body.md
          # A heading that is still `[Unreleased]` at tag time means the release
          # was never cut; an empty body would publish silently, so it fails.
          test -s body.md || {
            echo "::error::CHANGELOG.md has no '## [$SECTION]' section — move [Unreleased] into one"
            exit 1; }
          cat body.md
      - uses: actions/upload-artifact@v5
        with:
          name: release-body
          path: body.md
          if-no-files-found: error

      # **A source archive of our own, because GitHub's cannot be pinned.**
      # The "Source code (tar.gz)" GitHub attaches to every release is
      # generated on demand by `git archive`, and GitHub has changed its gzip
      # implementation before — silently moving the checksum of archives
      # already published, which broke every packager that had pinned one.
      # They reverted, and now promise notice rather than stability.  A
      # packager needs a hash that cannot move, so this ships an archive we
      # made and `SHA256SUMS` records it beside the binaries.
      #
      # Reproducible on purpose, and both halves are load-bearing: `git
      # archive` dates every entry from the commit rather than from now, and
      # `gzip -n` leaves the timestamp and the original name out of the gzip
      # header.  Without `-n`, GNU gzip is free to stamp the moment it ran and
      # the same tag would hash differently on every build — which is the exact
      # failure this asset exists to avoid.
      - name: Pack the source
        env:
          SECTION: ${{ steps.what.outputs.section }}
          REF: ${{ github.event_name == 'push' && github.ref_name || 'HEAD' }}
        run: |
          git archive --format=tar --prefix="org-semantic-$SECTION/" "$REF" \
            | gzip -9n > "org-semantic-$SECTION-src.tar.gz"
          ls -l "org-semantic-$SECTION-src.tar.gz"
      - uses: actions/upload-artifact@v5
        with:
          name: source
          path: org-semantic-*-src.tar.gz
          if-no-files-found: error

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: org-semantic-aarch64-macos.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: org-semantic-x86_64-linux.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: org-semantic-aarch64-linux.tar.gz
          # Builds and links -- `ort` takes its DirectML distribution, so the
          # binary wants DirectML.dll (present since Windows 10 1903).  The smoke
          # test below is the whole of what has ever been run on it: nobody has
          # indexed or searched anything on Windows.  Zip rather than tar.gz
          # because that is what Explorer opens.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: org-semantic-x86_64-windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install the Rust toolchain
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # The *archive* carries the platform in its name; the binary inside keeps
      # the name it is meant to have on PATH, so unpacking gives something ready
      # to use rather than something to rename.
      - name: Collect the binary
        shell: bash
        run: |
          BIN=org-semantic
          [ "${{ runner.os }}" = "Windows" ] && BIN=org-semantic.exe
          cp "target/${{ matrix.target }}/release/$BIN" "$BIN"
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      # Only macOS needs any of what follows.
      - name: Import the signing certificate
        if: runner.os == 'macOS'
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 20)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user \
            -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Sign and notarize
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        run: |
          set -euo pipefail

          # Hardened runtime and a secure timestamp are both required for
          # notarization.  Fail loudly: an unsigned release is not shippable.
          codesign --force --timestamp --options runtime \
            --sign "Developer ID Application: Andrea Alberti ($TEAM_ID)" "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"

          # notarytool takes a zip, a dmg or a pkg -- never a bare executable and
          # never a tarball, so this zip exists only to submit.  What is
          # published is the tar.gz built below, and it carries the same signed
          # bytes: the signature lives inside the Mach-O, not in the container.
          ditto -c -k "$BIN" "$RUNNER_TEMP/submit.zip"

          xcrun notarytool store-credentials "notary-profile" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$TEAM_ID"

          # `--wait` has returned 0 on a rejected submission before now, so the
          # status is read rather than inferred from the exit code.
          xcrun notarytool submit "$RUNNER_TEMP/submit.zip" \
            --keychain-profile "notary-profile" --wait \
            | tee "$RUNNER_TEMP/notary.log"
          grep -q "status: Accepted" "$RUNNER_TEMP/notary.log" || {
            echo "::error::notarization was not accepted"; cat "$RUNNER_TEMP/notary.log"; exit 1; }

          # **The ticket is not stapled, and cannot be.**  `stapler` supports
          # disk images, code-signed bundles and flat installer packages; a bare
          # Mach-O executable is none of them.  Notarization still counts -- the
          # ticket is registered against the cdhash -- but a *quarantined* copy
          # needs a network check on first run.  Which the ordinary paths never
          # hit: quarantine is set by browsers, and neither Emacs's url.el nor
          # curl sets it.  Verified by hand: quarantine the downloaded binary and
          # it still runs.

      # Catches a hardened-runtime failure, which shows up only on the signed
      # build and would otherwise ship.
      - name: Smoke test the binary that will be published
        shell: bash
        run: |
          chmod +x "$BIN" || true
          ./"$BIN" --version
          ./"$BIN" models

      # **Compressed, and not merely for tidiness.**  40.7 MB of binary is
      # 13.0 MB packed, and a release asset carries no mode bits -- a bare
      # binary downloads as 0644 and will not run until someone thinks to
      # `chmod +x`.  An archive records the mode and restores it.
      #
      # `tar.gz` where it can be, because Emacs unpacks one with no external
      # tool at all: `zlib-decompress-region` inflates it and `tar-untar-buffer`
      # extracts it, both built in.  Windows gets a zip, which is what Explorer
      # opens.
      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Windows) 7z a -mx=9 "${{ matrix.asset }}" "$BIN" > /dev/null ;;
            *)       tar czf "${{ matrix.asset }}" "$BIN" ;;
          esac
          ls -l "${{ matrix.asset }}"

      - name: Clean up the keychain
        if: always() && runner.os == 'macOS'
        run: security delete-keychain "$RUNNER_TEMP/build.keychain" || true

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  # The only job a dry run does not do.  Everything expensive and everything
  # touching credentials has already happened above; this is the step that
  # creates something, so it is the step a test must not reach.
  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: assets
          merge-multiple: true
      - name: Set the body aside, so it is not published as an asset
        run: mv assets/body.md .
      - name: Checksums
        run: |
          cd assets && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          body_path: body.md
          make_latest: true
          draft: true
          prerelease: false
